# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# Least privilege: kein Job braucht Schreibrechte
permissions:
  contents: read

# Veraltete Läufe desselben PRs abbrechen — spart Minuten bei Force-Pushes.
# Pushes auf main/develop laufen immer zu Ende.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: CI-Umgebung vorbereiten (Dummy-Secrets)
        run: |
          cp .env.example .env.local
          {
            echo "BREVO_API_KEY=ci_dummy_key_123"
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_dummy"
            echo "STRIPE_SECRET_KEY=sk_test_dummy"
          } >> .env.local

      - name: Vitest
        run: npm run test -- --run

  build:
    name: Production Build
    runs-on: ubuntu-latest
    # Schutz vor hängenden Builds (lokal bereits vorgekommen) —
    # ein Hänger darf keine 6h-Runner-Rechnung erzeugen
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Next.js Build-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: CI-Umgebung vorbereiten (Dummy-Secrets)
        run: |
          cp .env.example .env.local
          {
            echo "BREVO_API_KEY=ci_dummy_key_123"
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_dummy"
            echo "STRIPE_SECRET_KEY=sk_test_dummy"
          } >> .env.local

      - name: Next.js Build
        run: npm run build

  audit:
    # Bewusst nicht-blockierend: npm audit schlägt oft wegen transitiv
    # gemeldeter Advisories fehl, auf die wir keinen Einfluss haben.
    # Als eigener Job bleibt das Ergebnis trotzdem im PR sichtbar,
    # statt in einem grünen Log unterzugehen.
    name: Dependency Audit (informativ)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: npm audit (Produktions-Abhängigkeiten, ab High)
        run: npm audit --omit=dev --audit-level=high
