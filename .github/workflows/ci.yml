# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 🚀 NEU: Next.js Build-Cache (Macht die Pipeline drastisch schneller)
      - name: Next.js Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          # Erzeugt einen neuen Cache, sobald sich Abhängigkeiten oder Code ändern
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Abhängigkeiten installieren (Clean Install)
        run: npm ci

      # 🚀 NEU: Automatischer Sicherheits-Check für NPM-Pakete
      - name: Security Audit (NPM)
        run: npm audit --audit-level=high || true # '|| true' verhindert, dass der Build sofort abbricht, loggt aber die Warnungen

      - name: Environment Variables für CI vorbereiten
        run: |
          cp .env.example .env.local
          echo "BREVO_API_KEY=ci_dummy_key_123" >> .env.local
          echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_dummy" >> .env.local
          echo "STRIPE_SECRET_KEY=sk_test_dummy" >> .env.local

      # 🚀 TIPP: Falls du Prettier nutzt, hier einkommentieren:
      # - name: Formatierung prüfen (Prettier)
      #   run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css}"

      - name: Linter prüfen
        run: npm run lint

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Unit Tests ausführen
        run: npm run test -- --run

      - name: Production Build prüfen
        run: npm run build